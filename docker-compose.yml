version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: softlearn_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: SoftLearn_development
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/SoftLearn_development.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rails:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: softlearn_rails
    command: bash -c "bundle exec rails db:prepare && bundle exec rails s -b 0.0.0.0"
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/SoftLearn_development
      RAILS_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/rails
    stdin_open: true
    tty: true

volumes:
  postgres_data:
