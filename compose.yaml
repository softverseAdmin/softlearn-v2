services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Please set POSTGRES_PASSWORD in .env file}
      POSTGRES_DB: ${POSTGRES_DB:-SoftLearn_development}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  softlearn:
    image: softlearn
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - 3000:3000
    environment:
      RAILS_ENV: ${RAILS_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:?Please set DATABASE_URL in .env file}
      JWT_SECRET: ${JWT_SECRET:?Please set JWT_SECRET in .env file}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      GMAIL_USERNAME: ${GMAIL_USERNAME}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      BUNDLE_FROZEN: "0"
    depends_on:
      - postgres
    command: sh -c "bundle install && bundle exec rails db:prepare && bundle exec rails db:migrate && bundle exec rails s -b 0.0.0.0"
    volumes:
      - ./backend:/rails

volumes:
  postgres_data:
