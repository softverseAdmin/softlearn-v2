name: AI-DLC Check

on:
  workflow_dispatch:

jobs:
  aidlc-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Run AI-DLC check
        run: ./scripts/aidlc-check.sh
