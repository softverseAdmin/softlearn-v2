name: AI-DLC PR Review

on:
  pull_request:

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Run AI-DLC check
        run: ./scripts/aidlc-check.sh

      - name: Run Node checks if package.json exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            npm install
            npm run test --if-present
            npm run build --if-present
          else
            echo "No package.json present yet. Skipping Node-specific checks."
          fi

      - name: Set up Python for backend checks
        if: ${{ hashFiles('requirements.txt') != '' && hashFiles('backend/manage.py') != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run Django backend checks
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          DJANGO_DEBUG: "False"
        shell: bash
        run: |
          set -euo pipefail
          if [ -f requirements.txt ] && [ -f backend/manage.py ]; then
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            cd backend
            python manage.py check
            python manage.py test
          else
            echo "No Django backend detected yet."
          fi
