name: AI-DLC PR Review

on:
  pull_request:

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Run AI-DLC check
        run: ./scripts/aidlc-check.sh

      - name: Set up Node for frontend checks
        if: ${{ hashFiles('frontend/package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.2'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Run frontend checks if frontend/package.json exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -f frontend/package.json ]; then
            cd frontend
            npm install
            npm run build --if-present
            npm run lint --if-present
          else
            echo "No frontend/package.json present yet. Skipping frontend checks."
          fi

      - name: Set up Python for backend checks
        if: ${{ hashFiles('requirements.txt') != '' && hashFiles('backend/manage.py') != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run Django backend checks
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          DJANGO_DEBUG: "False"
        shell: bash
        run: |
          set -euo pipefail
          if [ -f requirements.txt ] && [ -f backend/manage.py ]; then
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            cd backend
            python manage.py check
            python manage.py test
          else
            echo "No Django backend detected yet."
          fi
