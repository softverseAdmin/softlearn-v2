name: Build

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install bandit

    - name: Run Bandit on repository code
      run: bandit -r backend/api backend/common backend/config backend/services backend/users -lll -f json -o backend/bandit-report.json
    
    - name: Django collectstatic
      working-directory: ./backend
      run: python manage.py collectstatic --noinput --clear
      env:
        DJANGO_SECRET_KEY: "build-key"
        DJANGO_DEBUG: "False"
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'
    
    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Run production npm audit
      working-directory: ./frontend
      run: npm audit --omit=dev --audit-level=high --json > npm-audit.json

    - name: Build React production bundle
      working-directory: ./frontend
      run: npm run build
    
    - name: Check bundle size
      working-directory: ./frontend
      run: |
        SIZE=$(ls -lh dist/*.js | awk '{sum+=$5} END {print sum}')
        echo "Bundle size: $SIZE"
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-files
        path: |
          backend/staticfiles/
          backend/bandit-report.json
          frontend/dist/
          frontend/npm-audit.json
        retention-days: 30
