name: Deploy to Hetzner

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-hetzner-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'production' }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  HETZNER_APP_DIR: /apps/softlearn

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'production' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit

      - name: Run Bandit on repository code
        run: bandit -r backend/api backend/common backend/config backend/services backend/users -lll -f json -o backend/bandit-report.json

      - name: Django collectstatic
        working-directory: ./backend
        run: python manage.py collectstatic --noinput --clear
        env:
          DJANGO_SECRET_KEY: "build-key"
          DJANGO_DEBUG: "False"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run production npm audit
        working-directory: ./frontend
        run: npm audit --omit=dev --audit-level=high --json > npm-audit.json

      - name: Build React production bundle
        working-directory: ./frontend
        run: npm run build

      - name: Check bundle size
        working-directory: ./frontend
        run: |
          SIZE=$(ls -lh dist/*.js | awk '{sum+=$5} END {print sum}')
          echo "Bundle size: $SIZE"

      - name: Upload validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deploy-validation-files
          path: |
            backend/staticfiles/
            backend/bandit-report.json
            frontend/dist/
            frontend/npm-audit.json
          retention-days: 30

  publish-images:
    runs-on: ubuntu-latest
    needs: build-and-validate
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'production' }}

    outputs:
      backend_image: ${{ steps.metadata.outputs.backend_image }}
      frontend_image: ${{ steps.metadata.outputs.frontend_image }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image metadata
        id: metadata
        run: |
          IMAGE_PREFIX="${REGISTRY}/${GITHUB_REPOSITORY,,}/hetzner/${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'production' }}"
          IMAGE_TAG="${GITHUB_SHA}"
          echo "backend_image=${IMAGE_PREFIX}-backend:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${IMAGE_PREFIX}-frontend:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: |
            ${{ steps.metadata.outputs.backend_image }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          tags: |
            ${{ steps.metadata.outputs.frontend_image }}

      - name: Publish image summary
        run: |
          {
            echo "## Published Hetzner images"
            echo ""
            echo "- Backend: \`${{ steps.metadata.outputs.backend_image }}\`"
            echo "- Frontend: \`${{ steps.metadata.outputs.frontend_image }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    runs-on: ubuntu-latest
    needs: publish-images
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'production' }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
          HETZNER_SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
        run: |
          test -n "$HETZNER_HOST"
          test -n "$HETZNER_USER"
          test -n "$HETZNER_PORT"
          test -n "$HETZNER_SSH_PRIVATE_KEY"

      - name: Configure SSH
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$HETZNER_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HETZNER_HOST" >> ~/.ssh/known_hosts

      - name: Upload Hetzner deployment files
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
          HETZNER_APP_DIR: ${{ env.HETZNER_APP_DIR }}
        run: |
          ssh -p "$HETZNER_PORT" "${HETZNER_USER}@${HETZNER_HOST}" "mkdir -p '${HETZNER_APP_DIR}/docker/nginx' '${HETZNER_APP_DIR}/media'"
          scp -P "$HETZNER_PORT" docker/docker-compose.hetzner.yml "${HETZNER_USER}@${HETZNER_HOST}:${HETZNER_APP_DIR}/docker/docker-compose.hetzner.yml"
          scp -P "$HETZNER_PORT" docker/nginx/softlearn.hetzner.conf "${HETZNER_USER}@${HETZNER_HOST}:${HETZNER_APP_DIR}/docker/nginx/softlearn.hetzner.conf"

      - name: Deploy on Hetzner host
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_READ_TOKEN: ${{ github.token }}
          BACKEND_IMAGE: ${{ needs.publish-images.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.publish-images.outputs.frontend_image }}
          HETZNER_APP_DIR: ${{ env.HETZNER_APP_DIR }}
        run: |
          ssh -p "$HETZNER_PORT" "${HETZNER_USER}@${HETZNER_HOST}" \
            "BACKEND_IMAGE='${BACKEND_IMAGE}' FRONTEND_IMAGE='${FRONTEND_IMAGE}' GHCR_USERNAME='${GHCR_USERNAME}' GHCR_READ_TOKEN='${GHCR_READ_TOKEN}' HETZNER_APP_DIR='${HETZNER_APP_DIR}' bash -s" <<'EOF'
          set -euo pipefail

          cd "$HETZNER_APP_DIR"
          test -f .env
          export BACKEND_IMAGE FRONTEND_IMAGE

          mkdir -p media
          chown -R 1000:1000 media
          chmod 755 media

          echo "$GHCR_READ_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

          docker compose --env-file .env -f docker/docker-compose.hetzner.yml pull backend-release backend worker frontend postgres redis
          docker compose --env-file .env -f docker/docker-compose.hetzner.yml up -d postgres redis
          docker compose --env-file .env -f docker/docker-compose.hetzner.yml --profile release run --rm backend-release
          docker compose --env-file .env -f docker/docker-compose.hetzner.yml up -d --force-recreate backend worker frontend

          curl --fail --silent http://127.0.0.1:8080/healthz > /dev/null
          curl --fail --silent http://127.0.0.1:8080/api/v1/ready > /dev/null

          docker image prune -f > /dev/null || true
          EOF

      - name: Publish deployment summary
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          {
            echo ""
             echo "## Hetzner deployment"
             echo ""
             echo "- Environment: \`${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'production' }}\`"
             echo "- Host: \`${HETZNER_HOST}\`"
             echo "- Backend image: \`${{ needs.publish-images.outputs.backend_image }}\`"
             echo "- Frontend image: \`${{ needs.publish-images.outputs.frontend_image }}\`"
            echo "- Health checks: passed on host"
          } >> "$GITHUB_STEP_SUMMARY"
