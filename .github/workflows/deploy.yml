name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish-images:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image metadata
        run: |
          IMAGE_PREFIX="${REGISTRY}/${GITHUB_REPOSITORY,,}/${{ github.event.inputs.environment }}"
          echo "IMAGE_PREFIX=$IMAGE_PREFIX" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "LATEST_TAG=${{ github.event.inputs.environment }}-latest" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        id: build_backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_PREFIX }}-backend:${{ env.LATEST_TAG }}

      - name: Build and push frontend image
        id: build_frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_PREFIX }}-frontend:${{ env.LATEST_TAG }}

      - name: Publish summary
        run: |
          {
            echo "## Published deployment images"
            echo ""
             echo "- Backend: \`${IMAGE_PREFIX}-backend:${IMAGE_TAG}\`"
             echo "- Backend latest: \`${IMAGE_PREFIX}-backend:${LATEST_TAG}\`"
             echo "- Backend digest: \`${{ steps.build_backend.outputs.digest }}\`"
             echo "- Frontend: \`${IMAGE_PREFIX}-frontend:${IMAGE_TAG}\`"
             echo "- Frontend latest: \`${IMAGE_PREFIX}-frontend:${LATEST_TAG}\`"
             echo "- Frontend digest: \`${{ steps.build_frontend.outputs.digest }}\`"
           } >> "$GITHUB_STEP_SUMMARY"

  deploy-platform:
    runs-on: ubuntu-latest
    needs: publish-images
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Validate deploy hooks
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
          BACKEND_HEALTHCHECK_URL: ${{ secrets.BACKEND_HEALTHCHECK_URL }}
          FRONTEND_HEALTHCHECK_URL: ${{ secrets.FRONTEND_HEALTHCHECK_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL"
          test -n "$VERCEL_DEPLOY_HOOK_URL"
          test -n "$BACKEND_HEALTHCHECK_URL"
          test -n "$FRONTEND_HEALTHCHECK_URL"

      - name: Trigger Render backend deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Trigger Vercel frontend deployment
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --silent --show-error --request POST "$VERCEL_DEPLOY_HOOK_URL"

      - name: Wait for platform health checks
        env:
          BACKEND_HEALTHCHECK_URL: ${{ secrets.BACKEND_HEALTHCHECK_URL }}
          FRONTEND_HEALTHCHECK_URL: ${{ secrets.FRONTEND_HEALTHCHECK_URL }}
        run: |
          check_url() {
            url="$1"
            name="$2"
            attempt=1
            max_attempts=30

            while [ "$attempt" -le "$max_attempts" ]; do
              status_code="$(curl --output /tmp/healthcheck-body --silent --show-error --write-out "%{http_code}" "$url" || true)"
              if [ "$status_code" = "200" ]; then
                echo "$name healthy at $url"
                return 0
              fi

              echo "Waiting for $name health check ($attempt/$max_attempts, status=${status_code:-unreachable})"
              attempt=$((attempt + 1))
              sleep 10
            done

            echo "$name health check failed for $url" >&2
            [ -f /tmp/healthcheck-body ] && cat /tmp/healthcheck-body >&2
            return 1
          }

          check_url "$BACKEND_HEALTHCHECK_URL" "backend"
          check_url "$FRONTEND_HEALTHCHECK_URL" "frontend"

      - name: Publish deployment summary
        run: |
          {
            echo ""
            echo "## Triggered deployments"
            echo ""
            echo "- Environment: \`${{ github.event.inputs.environment }}\`"
            echo "- Render backend deploy hook: triggered"
            echo "- Vercel frontend deploy hook: triggered"
            echo "- Backend health check: passed"
            echo "- Frontend health check: passed"
          } >> "$GITHUB_STEP_SUMMARY"
