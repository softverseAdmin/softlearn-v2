name: Publish Deployment Images

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish-images:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image metadata
        run: |
          IMAGE_PREFIX="${REGISTRY}/${GITHUB_REPOSITORY,,}/${{ github.event.inputs.environment }}"
          echo "IMAGE_PREFIX=$IMAGE_PREFIX" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "LATEST_TAG=${{ github.event.inputs.environment }}-latest" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_PREFIX }}-backend:${{ env.LATEST_TAG }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_PREFIX }}-frontend:${{ env.LATEST_TAG }}

      - name: Publish summary
        run: |
          {
            echo "## Published deployment images"
            echo ""
            echo "- Backend: \`${IMAGE_PREFIX}-backend:${IMAGE_TAG}\`"
            echo "- Backend latest: \`${IMAGE_PREFIX}-backend:${LATEST_TAG}\`"
            echo "- Frontend: \`${IMAGE_PREFIX}-frontend:${IMAGE_TAG}\`"
            echo "- Frontend latest: \`${IMAGE_PREFIX}-frontend:${LATEST_TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"
