name: Security

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sundays
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install bandit safety
    
    - name: Run Bandit security scan
      working-directory: ./backend
      run: bandit -r . -f json -o bandit-report.json || true
    
    - name: Check Python dependencies for vulnerabilities
      run: safety check --json || true
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'
    
    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci
    
    - name: Run npm audit for vulnerabilities
      working-directory: ./frontend
      run: npm audit --json > npm-audit.json || true
    
    - name: Check for vulnerable packages
      working-directory: ./frontend
      run: |
        if npm audit | grep -q "vulnerabilities"; then
          echo "::warning::Vulnerable packages detected. Review npm-audit.json"
        fi
      continue-on-error: true
    
    - name: Upload security reports
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: |
          backend/bandit-report.json
          frontend/npm-audit.json
        retention-days: 90
    
    - name: SAST scanning with CodeQL
      uses: github/super-linter@v4
      env:
        DEFAULT_BRANCH: main
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true
    
    - name: Dependency check
      run: |
        echo "Checking for outdated dependencies..."
        pip list --outdated || true
    
    - name: Security summary
      run: |
        echo "## Security Scan Results"
        echo ""
        echo "### Python Security"
        echo "Run: bandit -r backend"
        echo ""
        echo "### JavaScript Security"
        echo "Run: npm audit"
        echo ""
        echo "Review security reports for details."
