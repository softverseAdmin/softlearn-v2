name: Security

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sundays
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install backend dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install bandit
    
    - name: Run Bandit security scan
      run: bandit -r . -f json -o bandit-report.json || true
      working-directory: .
      continue-on-error: true
    
    - name: Run Bandit on repository code
      id: bandit
      run: |
        set +e
        bandit -r backend/api backend/common backend/config backend/services backend/users -lll -f json -o backend/bandit-report.json
        echo "exit_code=$?" >> "$GITHUB_OUTPUT"
        exit 0
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'
    
    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci
    
    - name: Run production npm audit
      id: npm_audit
      working-directory: ./frontend
      run: |
        set +e
        npm audit --omit=dev --audit-level=high --json > npm-audit.json
        echo "exit_code=$?" >> "$GITHUB_OUTPUT"
        exit 0
    
    - name: Upload security reports
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: |
          backend/bandit-report.json
          frontend/npm-audit.json
        retention-days: 90
    
    - name: Security summary
      run: |
        {
          echo "## Security scan results"
          echo ""
          echo "- Bandit exit code: ${{ steps.bandit.outputs.exit_code }}"
          echo "- npm audit exit code: ${{ steps.npm_audit.outputs.exit_code }}"
          echo ""
          echo "Artifacts:"
          echo "- backend/bandit-report.json"
          echo "- frontend/npm-audit.json"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Enforce security gate
      run: |
        test "${{ steps.bandit.outputs.exit_code }}" = "0"
        test "${{ steps.npm_audit.outputs.exit_code }}" = "0"
